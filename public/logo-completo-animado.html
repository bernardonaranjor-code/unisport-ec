const img = new Image();
img.onload = init;
img.src = SRC;

const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
};
const clamp = v => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));

// Zona del símbolo y franjas de texto (en píxeles de la imagen original)
const SYMBOL_BOTTOM = 440;
const TITLE = [470, 580], LINE = [600, 640], SUB = [645, 690];

let W, H, CX, CY, K, pieces, main, off, offCtx, start, titleGlyphs, subGlyphs, lineBox;
const SS = 2;

function glyphs(d, y0, y1) {
  const cols = [];
  for (let x = 0; x < W; x++) {
    let on = false;
    for (let y = y0; y < Math.min(y1, H); y++) if (d[(y*W + x)*4 + 3] > 0) { on = true; break; }
    cols.push(on);
  }
  const out = []; let s = -1, gap = 0;
  for (let x = 0; x <= W; x++) {
    if (x < W && cols[x]) { if (s < 0) s = x; gap = 0; }
    else if (s >= 0) { gap++; if (gap >= 4 || x === W) { out.push([s, x - gap + 1]); s = -1; gap = 0; } }
  }
  return out;
}

function init() {
  W = img.naturalWidth; H = img.naturalHeight;
  const canvas = document.getElementById('c');
  canvas.width = W * SS; canvas.height = H * SS;
  main = canvas.getContext('2d');
  off = document.createElement('canvas'); off.width = W; off.height = SYMBOL_BOTTOM; offCtx = off.getContext('2d');

  const s = document.createElement('canvas'); s.width = W; s.height = H;
  const sctx = s.getContext('2d'); sctx.drawImage(img, 0, 0);
  const d = sctx.getImageData(0, 0, W, H).data;
  const isGold = i => d[i+3] > 0 && d[i] - d[i+2] > 30;

  // Centro = centroide del punto dorado
  let sx = 0, sy = 0, n = 0;
  for (let y = 12; y < SYMBOL_BOTTOM; y++) for (let x = 12; x < W - 12; x++) {
    const i = (y*W + x)*4;
    if (!isGold(i) || d[i+3] < 200) continue;
    let ok = true;
    for (const [kx, ky] of [[-12,0],[12,0],[0,-12],[0,12]]) if (!isGold(((y+ky)*W + x + kx)*4)) { ok = false; break; }
    if (ok) { sx += x; sy += y; n++; }
  }
  CX = sx/n; CY = sy/n;

  // Escala del símbolo según el radio de los arcos blancos
  let rw = 0, cnt = 0;
  for (let y = 0; y < SYMBOL_BOTTOM; y++) for (let x = 0; x < W; x++) {
    const i = (y*W + x)*4; if (d[i+3] < 200 || isGold(i)) continue;
    const r = Math.hypot(x - CX, y - CY); if (r > 120) { rw += r; cnt++; }
  }
  K = (cnt ? rw/cnt : 236) / 236;

  const names = ['cross','dot','diag','gU','gL','wU','wL'];
  pieces = {};
  for (const k of names) {
    const c = document.createElement('canvas'); c.width = W; c.height = SYMBOL_BOTTOM;
    pieces[k] = { c, data: new ImageData(W, SYMBOL_BOTTOM), aMin: Infinity, aMax: -Infinity, rMax: 0, lMax: 0 };
  }
  for (let y = 0; y < SYMBOL_BOTTOM; y++) for (let x = 0; x < W; x++) {
    const i = (y*W + x)*4; if (d[i+3] === 0) continue;
    const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
    let k;
    if (isGold(i)) {
      if (r <= 24*K) k = 'dot';
      else if (Math.abs(dx - dy) / Math.SQRT2 <= 6.5*K) k = 'diag';
      else k = dy < 0 ? 'gU' : 'gL';
    } else {
      if (d[i+3] < 140 && (Math.abs(dx) <= 4 || Math.abs(dy) <= 4)) k = 'cross';
      else if (r > 180*K) k = dy < 0 ? 'wU' : 'wL';
      else k = 'cross';
    }
    const p = pieces[k];
    p.data.data.set(d.subarray(i, i+4), i);
    const a = Math.atan2(dy, dx);
    if (a < p.aMin) p.aMin = a; if (a > p.aMax) p.aMax = a;
    if (r > p.rMax) p.rMax = r;
    const l = Math.abs(dx + dy) / Math.SQRT2; if (l > p.lMax) p.lMax = l;
  }
  for (const k of names) pieces[k].c.getContext('2d').putImageData(pieces[k].data, 0, 0);

  titleGlyphs = glyphs(d, TITLE[0], TITLE[1]);
  subGlyphs = glyphs(d, SUB[0], SUB[1]);
  let lx0 = W, lx1 = 0;
  for (let y = LINE[0]; y < LINE[1]; y++) for (let x = 0; x < W; x++) if (d[(y*W + x)*4 + 3] > 0) { lx0 = Math.min(lx0, x); lx1 = Math.max(lx1, x); }
  lineBox = [lx0, lx1 + 1];

  start = performance.now();
  requestAnimationFrame(frame);
}

function drawPiece(p, mask, { rot = 0, scale = 1, alpha = 1 } = {}) {
  offCtx.globalCompositeOperation = 'source-over';
  offCtx.clearRect(0, 0, W, SYMBOL_BOTTOM);
  offCtx.drawImage(p.c, 0, 0);
  if (mask) {
    offCtx.globalCompositeOperation = 'destination-in';
    offCtx.beginPath(); mask(offCtx); offCtx.fillStyle = '#000'; offCtx.fill();
  }
  main.save();
  main.globalAlpha = alpha;
  main.translate(CX, CY); main.rotate(rot); main.scale(scale, scale); main.translate(-CX, -CY);
  main.drawImage(off, 0, 0);
  main.restore();
}

const wedge = (p, t, reverse) => ctx => {
  const pad = 0.12, a0 = p.aMin - pad, a1 = p.aMax + pad, R = Math.max(W, H);
  ctx.moveTo(CX, CY);
  if (!reverse) ctx.arc(CX, CY, R, a0, a0 + (a1 - a0) * t);
  else ctx.arc(CX, CY, R, a1 - (a1 - a0) * t, a1);
  ctx.closePath();
};

// Letras: aparecen una a una subiendo suavemente
function drawGlyphs(list, band, t, t0, stagger, dur, rise) {
  list.forEach(([x0, x1], j) => {
    const p = prog(t, t0 + j*stagger, t0 + j*stagger + dur);
    if (p <= 0) return;
    const e = ease.outCubic(p), w = x1 - x0, h = band[1] - band[0];
    main.save(); main.globalAlpha = e;
    main.drawImage(img, x0, band[0], w, h, x0, band[0] + (1 - e) * rise, w, h);
    main.restore();
  });
}

let END = 0;
function frame(now) {
  const t = (now - start) / 1000;
  main.setTransform(SS, 0, 0, SS, 0, 0);
  main.clearRect(0, 0, W, H);

  const tTitle = 2.0, tLine = tTitle + titleGlyphs.length*0.06 + 0.2, tSub = tLine + 0.35;
  END = tSub + subGlyphs.length*0.035 + 0.6;

  if (t >= END) { main.drawImage(img, 0, 0); return; } // fotograma final = PNG original, queda fijo

  // Símbolo
  const pc = ease.outCubic(prog(t, 0.0, 1.0));
  if (pc > 0) { const L = pc * pieces.cross.rMax + 2; drawPiece(pieces.cross, c => c.rect(CX - L, CY - L, 2*L, 2*L), { alpha: pc }); }
  const pg = prog(t, 1.05, 2.3);
  if (pg > 0) { const e = ease.outCubic(pg), o = { rot: (1 - e) * -110 * Math.PI/180, alpha: clamp(pg*4) };
    drawPiece(pieces.gU, wedge(pieces.gU, e), o); drawPiece(pieces.gL, wedge(pieces.gL, e), o); }
  const pw = prog(t, 1.5, 3.0);
  if (pw > 0) { const e = ease.outCubic(pw), o = { rot: (1 - e) * 80 * Math.PI/180, alpha: clamp(pw*4) };
    drawPiece(pieces.wU, wedge(pieces.wU, e, true), o); drawPiece(pieces.wL, wedge(pieces.wL, e, true), o); }
  const pd = ease.inOutCubic(prog(t, 0.65, 1.3));
  if (pd > 0) { const L = pd * pieces.diag.lMax + 6;
    drawPiece(pieces.diag, c => { c.save(); c.translate(CX, CY); c.rotate(Math.PI/4); c.rect(-L, -20, 2*L, 40); c.restore(); }); }
  const pp = prog(t, 0.25, 0.85);
  if (pp > 0) drawPiece(pieces.dot, null, { scale: Math.max(0, ease.outBack(pp)), alpha: clamp(pp*3) });

  // Nombre
  drawGlyphs(titleGlyphs, TITLE, t, tTitle, 0.06, 0.6, 14);
  // Línea dorada: crece desde el centro
  const pl = ease.inOutCubic(prog(t, tLine, tLine + 0.7));
  if (pl > 0) {
    const mid = (lineBox[0] + lineBox[1]) / 2, half = (lineBox[1] - lineBox[0]) / 2 * pl;
    main.drawImage(img, mid - half, LINE[0], 2*half, LINE[1] - LINE[0], mid - half, LINE[0], 2*half, LINE[1] - LINE[0]);
  }
  // Subtítulo
  drawGlyphs(subGlyphs, SUB, t, tSub, 0.035, 0.5, 8);

  requestAnimationFrame(frame);
}
</script>
